spring.application.name=leo-shift

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leo_shift}
spring.datasource.username=${DB_USERNAME:leo_shift}
spring.datasource.password=${DB_PASSWORD:leo_shift}

# 스키마는 Flyway만 바꾼다. Hibernate가 건드리면 환경마다 스키마가 어긋난다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway — 새 스키마 (docs/domain-design.md)
spring.flyway.locations=classpath:db/migration-next
spring.flyway.baseline-on-migrate=false

# 리버스 프록시(Cloudflare Tunnel 등) 뒤에서 원본 요청 정보를 사용
server.forward-headers-strategy=framework

# Logging
logging.level.org.springframework.security=INFO
