spring.datasource.url=${LOCAL_DATABASE_URL:jdbc:postgresql://localhost:5432/leo_shift}
spring.datasource.username=${LOCAL_DATABASE_USERNAME:leo_shift}
spring.datasource.password=${LOCAL_DATABASE_PASSWORD:leo_shift}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${LOCAL_JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.frontend-url=${LOCAL_APP_FRONTEND_URL:http://localhost:8080}
app.backend-url=${LOCAL_APP_BACKEND_URL:http://localhost:8080}
app.oauth2.redirect-uri=${LOCAL_APP_FRONTEND_URL:http://localhost:8080}/login.html

jwt.secret=${LOCAL_JWT_SECRET:local-development-secret-key-change-before-sharing}
jwt.expiration=${LOCAL_JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${LOCAL_JWT_REFRESH_EXPIRATION:604800000}

spring.security.oauth2.client.registration.google.client-id=${LOCAL_GOOGLE_CLIENT_ID:local-dev}
spring.security.oauth2.client.registration.google.client-secret=${LOCAL_GOOGLE_CLIENT_SECRET:local-dev}
spring.security.oauth2.client.registration.google.redirect-uri=${LOCAL_APP_BACKEND_URL:http://localhost:8080}/login/oauth2/code/google

logging.level.org.springframework.security=${LOCAL_SECURITY_LOG_LEVEL:INFO}
